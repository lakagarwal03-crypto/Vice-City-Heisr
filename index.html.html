<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vice City Heist: Burner Phone</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff1f7;--fg:#2a1250;--panel:#ffffff;--line:#e9c6dc;--pink:#d6246e;--cyan:#007d78;--sun1:#ff9f43;--sun2:#ff4f9a;--mute:#6d5a8a;--ok:#0a7d4b;--bad:#c4152f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a0b36;--fg:#fbe9ff;--panel:#2a1255;--line:#4b2a86;--pink:#ff5fa8;--cyan:#38f0e0;--mute:#b9a3e0;--ok:#4be39c;--bad:#ff6b81;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a0b36;--fg:#fbe9ff;--panel:#2a1255;--line:#4b2a86;--pink:#ff5fa8;--cyan:#38f0e0;--mute:#b9a3e0;--ok:#4be39c;--bad:#ff6b81;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:Outfit,system-ui,sans-serif;font-size:17px;line-height:1.5;min-height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:560px;margin:0 auto;padding:0 18px 48px}
.hero{position:relative;overflow:hidden;padding:34px 18px 26px;text-align:center;background:linear-gradient(var(--bg),var(--bg))}
.sun{position:absolute;left:50%;top:-70px;width:260px;height:260px;margin-left:-130px;border-radius:50%;background:linear-gradient(var(--sun1),var(--sun2));
-webkit-mask:repeating-linear-gradient(#000 0 14px,transparent 14px 17px);mask:repeating-linear-gradient(#000 0 14px,transparent 14px 17px);-webkit-mask-position:0 60px;mask-position:0 60px;opacity:.9}
h1{font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:clamp(34px,10vw,52px);line-height:1;margin:0;position:relative;color:var(--fg);text-shadow:3px 3px 0 var(--pink)}
.sub{position:relative;margin:10px 0 0;color:var(--fg);font-weight:600}
h2{font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:22px;margin:22px 0 8px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.card.live{border-color:var(--cyan)}
.clue{white-space:pre-line;font-size:19px;font-weight:600;margin:6px 0 12px}
.q{margin:0 0 12px;color:var(--fg)}
.meta{color:var(--mute);font-size:15px}
label{display:block;font-weight:600;margin:10px 0 4px}
input{width:100%;font:inherit;font-size:20px;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--fg)}
input:focus,button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
button{font:inherit;font-weight:600;font-size:18px;padding:13px 18px;border:0;border-radius:10px;background:var(--pink);color:#fff;cursor:pointer;margin-top:12px;width:100%}
button.alt{background:transparent;color:var(--fg);border:2px solid var(--line)}
button:disabled{opacity:.45;cursor:not-allowed}
.routes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.routes button{margin:0;color:#fff;border:3px solid transparent}
.routes button[aria-pressed=true]{border-color:var(--fg)}
.timer{font-family:Bungee,Impact,sans-serif;font-size:34px;color:var(--cyan)}
.timer.low{color:var(--bad)}
.msg{min-height:1.5em;margin:8px 0 0;font-weight:600}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.digits{display:flex;gap:8px;margin:6px 0}
.digits span{flex:1;text-align:center;font-family:Bungee,Impact,sans-serif;font-size:28px;border:2px dashed var(--line);border-radius:10px;padding:8px 0}
.digits span.got{border-style:solid;border-color:var(--cyan);color:var(--cyan)}
.big{font-family:Bungee,Impact,sans-serif;font-size:clamp(30px,9vw,44px);line-height:1.05;margin:8px 0;color:var(--ok)}
.foot{margin-top:28px;text-align:center}
.foot button{width:auto;font-size:15px;padding:8px 14px}
@media (prefers-reduced-motion:no-preference){.shake{animation:sh .3s}}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>
<body>
<div class="hero"><div class="sun" aria-hidden="true"></div><h1>Vice City<br>Heist</h1><p class="sub">Round 3 burner phone</p></div>
<div class="wrap" id="app"></div>
<script>
// ORGANISER CONFIG: location PINs are handed out by the volunteer at each stop. Change them before the event.
var PINS={"Library":"4821","Flavors":"3317","Amphitheatre":"6092","Corridors":"7745","Academic Block":"1358","Faculty Block":"2906"};
var CAP=20*60, WIN=60;
var R={
Red:{c:"#d6246e",code:"256",cards:[
{loc:"Library",clue:"I lend for free, but I fine you when you are late. Silence is my law. Find me.",q:"By how many basis points did the RBI raise the repo rate on 7 October 2026? Take the first digit.",a:25,d:"2"},
{loc:"Flavors",clue:"Here, demand meets supply at lunchtime. The menu is the price list and the queue is the market. My name is what your tongue reads.",q:"What was the repo rate (%) after that hike? Take the whole-number part.",a:5.5,d:"5"},
{loc:"Amphitheatre",clue:"Stepped seats and open sky, with no roof. Every speaker here faces a crowd and a debate. Find the stage without walls.",q:"What was India’s retail inflation (%) for October 2026? Take the whole-number part.",a:6.09,d:"6"}],
fin:"This is where the night began. The lights are brightest here and the vault sits behind the curtain. Go back to the stage."},
Blue:{c:"#1f6feb",code:"743",cards:[
{loc:"Academic Block",clue:"Marginal thinking is taught here and attendance is not optional. Find the wing full of classrooms.",q:"What was India’s real GDP growth (%) for April to June 2026? Take the whole-number part.",a:7.8,d:"7"},
{loc:"Corridors",clue:"I connect every room but belong to none. Everyone passes through me between classes, and I charge them in minutes.",q:"What is the Centre’s FY27 fiscal deficit target as a percentage of GDP? Take the whole-number part.",a:4.3,d:"4"},
{loc:"Library",clue:"Shelves are my skyline and “please be quiet” is my anthem. Return what you borrow before the fine bites.",q:"How many companies are in the Sensex? Take the first digit.",a:30,d:"3"}],
fin:"Rows of seats, one stage and one screen that showed your score. Return to the place where the heist was planned."},
Green:{c:"#0a7d4b",code:"814",cards:[
{loc:"Faculty Block",clue:"The people who set your marks sit here. Walk softly, they are working, and nobody gets marks for noise.",q:"What was India’s food inflation (%) in October 2026? Take the whole-number part.",a:8.94,d:"8"},
{loc:"Amphitheatre",clue:"DPSKLWKHDWUH\nEvery letter was pushed 3 places forward in the alphabet. Shift each one back.",q:"By what percentage did onion prices rise year on year in October 2026? Take the first digit.",a:116.22,d:"1"},
{loc:"Corridors",clue:"3-15-18-18-9-4-15-18-19\nNumbers, not names. A is 1, B is 2, and so on.",q:"By the end of September 2026, what share (%) of the FY27 fiscal deficit target had been used? Take the first digit.",a:42.1,d:"4"}],
fin:"1-21-4-9-20-15-18-9-21-13\nNumbers, not names. A is 1, B is 2, and so on."},
Yellow:{c:"#b8860b",code:"831",cards:[
{loc:"Flavors",clue:"Fresh smells are the first clue.\nLunchtime is when this place makes its money.\nAlways a queue at the counter.\nVarious snacks, one long line.\nOpen until the last class ends.\nRumours are traded here over tea.\nSit down, someone is waiting.\nRead the first letter of every line.",q:"What was India’s Q4 FY26 growth (%) after its upward revision? Take the whole-number part.",a:8.6,d:"8"},
{loc:"Faculty Block",clue:"JEGYPXC FPSGO\nEvery letter was pushed 4 places forward in the alphabet. Shift each one back.",q:"After the Fed’s September 2026 hike, what was the lower end of its rate range (%)? Take the whole-number part.",a:3.75,d:"3"},
{loc:"Academic Block",clue:"A lecture is going on somewhere here.\nChalk, markers and a lot of coffee.\nAttendance is taken before anything else.\nDeadlines are pinned on every wall.\nExams start from here.\nMarks decide who gets the last laugh.\nIn every room, someone is taking notes.\nCome and find the wing full of classrooms.\nRead the first letter of every line.",q:"What was India’s nominal GDP growth (%) in Q1 FY27? Take the first digit.",a:10.3,d:"1"}],
fin:"CWFKVQTKWO\nEvery letter was pushed 2 places forward in the alphabet. Shift each one back."}
};
var S=load()||{step:"setup",route:"Red",crew:"",i:0,digits:[],qs:0,t0:0,t1:0,locked:false,done:[]};
var tick=null,app=document.getElementById("app");
function load(){try{return JSON.parse(localStorage.getItem("vch")||"null")}catch(e){return null}}
function save(){try{localStorage.setItem("vch",JSON.stringify(S))}catch(e){}}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function fmt(s){s=Math.max(0,Math.floor(s));return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
function now(){return Date.now()/1000}
function digitsHtml(){var h='<div class="digits" aria-label="Vault digits">';for(var k=0;k<3;k++){var g=S.digits[k];h+='<span class="'+(g&&g!=="?"?"got":"")+'">'+(g||"_")+"</span>"}return h+"</div>"}
function render(){
 clearInterval(tick);
 var r=R[S.route],h="";
 if(S.step==="setup"){
  h='<div class="card"><p class="meta">Marshal: choose the route colour, enter the crew name, then start the clock when the crew leaves the Auditorium.</p>'+
  '<label for="crew">Crew name</label><input id="crew" autocomplete="off" value="'+esc(S.crew)+'">'+
  '<label>Route colour</label><div class="routes">'+Object.keys(R).map(function(k){return '<button data-r="'+k+'" aria-pressed="'+(k===S.route)+'" style="background:'+R[k].c+'">'+k+"</button>"}).join("")+"</div>"+
  '<button id="go">Start the heist</button></div>';
 }else if(S.step==="card"){
  var c=r.cards[S.i];
  h='<div class="meta">'+esc(S.crew||"Your crew")+" on the "+S.route+" route. Heist clock <b id='tot'></b> of 20:00.</div>"+digitsHtml()+
  '<div class="card live"><div class="meta">Message '+(S.i+1)+" of 3</div><div class=\"clue\">"+esc(c.clue)+"</div>"+
  '<p class="q"><b>Intel question:</b> '+esc(c.q)+'</p><div class="timer" id="qt"></div>'+
  '<label for="ans">Your answer</label><input id="ans" inputmode="decimal" autocomplete="off"><button id="sub">Record answer</button><div class="msg" id="m" role="status"></div></div>'+
  '<div class="card"><b>Reached the location?</b><p class="meta">Ask the volunteer for the location PIN to unlock the next message.</p>'+
  '<label for="pin">Location PIN</label><input id="pin" inputmode="numeric" autocomplete="off"><button class="alt" id="unl">Unlock next message</button><div class="msg" id="pm" role="status"></div></div>';
 }else if(S.step==="final"){
  h='<div class="meta">'+esc(S.crew||"Your crew")+" on the "+S.route+" route. Heist clock <b id='tot'></b> of 20:00.</div>"+digitsHtml()+
  '<div class="card live"><div class="meta">Final message</div><div class="clue">'+esc(r.fin)+"</div>"+
  '<p class="meta">At the Auditorium vault, enter your three digits in the order you collected them. A missed digit shows as ?.</p>'+
  '<label for="v">Vault code</label><input id="v" inputmode="numeric" maxlength="3" autocomplete="off"><button id="open">Open the vault</button><div class="msg" id="m" role="status"></div></div>';
 }else{
  h='<div class="card live"><div class="big">Mission passed</div><p>'+esc(S.crew||"Your crew")+" cracked the "+S.route+" vault.</p><div class=\"timer\">"+fmt(S.t1-S.t0)+'</div><p class="meta">Official time. Show this screen to the judge to confirm your finish.</p></div>';
 }
 h+='<div class="foot"><button class="alt" id="rs">Reset this device</button></div>';
 app.innerHTML=h;wire();
 if(S.step==="card"||S.step==="final"){tick=setInterval(upd,500);upd()}
}
function upd(){
 var t=document.getElementById("tot");if(t){var e=now()-S.t0;t.textContent=fmt(e);if(e>CAP)t.style.color="var(--bad)"}
 var q=document.getElementById("qt");
 if(q){var left=WIN-(now()-S.qs);
  if(left<=0){q.textContent="Time’s up";q.className="timer low";if(!S.locked){S.locked=true;if(!S.digits[S.i])S.digits[S.i]="?";save();lockInputs()}}
  else{q.textContent=fmt(left);q.className="timer"+(left<=10?" low":"")}}
}
function lockInputs(){var a=document.getElementById("ans"),b=document.getElementById("sub"),m=document.getElementById("m");
 if(a)a.disabled=true;if(b)b.disabled=true;if(m&&!S.digits[S.i]||(m&&S.digits[S.i]==="?")){m.textContent="Answer window closed. Move on to the location.";m.className="msg bad"}}
function shake(el){el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake")}
function wire(){
 var $=function(i){return document.getElementById(i)};
 document.querySelectorAll("[data-r]").forEach(function(b){b.onclick=function(){S.crew=$("crew").value;S.route=b.dataset.r;save();render()}});
 if($("go"))$("go").onclick=function(){S.crew=$("crew").value.trim();S.step="card";S.i=0;S.digits=[];S.t0=now();S.qs=now();S.locked=false;save();render()};
 if($("sub"))$("sub").onclick=function(){
  var c=R[S.route].cards[S.i],v=parseFloat(($("ans").value||"").replace("%","")),m=$("m");
  if(S.locked){return}
  if(!isNaN(v)&&Math.abs(v-c.a)<1e-6){S.digits[S.i]=c.d;save();m.textContent="Intel recorded. Digit "+c.d+" added to your vault code.";m.className="msg ok";$("ans").disabled=true;$("sub").disabled=true;var d=document.querySelector(".digits");d.outerHTML=digitsHtml()}
  else{m.textContent="That is not the right intel. Check the fact sheet and try again before the timer ends.";m.className="msg bad";shake($("ans"))}};
 if($("unl"))$("unl").onclick=function(){
  var c=R[S.route].cards[S.i],pm=$("pm");
  if($("pin").value.trim()!==PINS[c.loc]){pm.textContent="Wrong PIN. Confirm you are at the right location and ask the volunteer.";pm.className="msg bad";shake($("pin"));return}
  S.i++;S.locked=false;S.qs=now();if(S.i>=3){S.step="final"}save();render()};
 if($("open"))$("open").onclick=function(){
  var m=$("m"),v=$("v").value.trim();
  if(v===R[S.route].code){S.t1=now();S.step="done";save();render()}
  else{m.textContent="Vault jammed. Check your digits and the order you collected them.";m.className="msg bad";shake($("v"))}};
 if($("rs"))$("rs").onclick=function(){if(confirm("Reset the burner phone on this device? Progress will be lost.")){try{localStorage.removeItem("vch")}catch(e){}S={step:"setup",route:"Red",crew:"",i:0,digits:[],qs:0,t0:0,t1:0,locked:false,done:[]};render()}};
}
render();
</script>
</body>
</html>
